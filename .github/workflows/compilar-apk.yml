name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar carpeta web para Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/ || true
          cp -r icons www/ || true

      - name: Instalar Capacitor 6 (Estable)
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Configurar Capacitor y plataforma Android
        run: |
          npx cap init "Nuestra Compra" "com.familia.nuestracompra" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: NuestraCompra-Instalable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
