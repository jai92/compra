name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 6 está probado con Java 17 (con 21 su Gradle puede fallar)
      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor y librerías de la app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
            firebase@10.14.1 @fortawesome/fontawesome-free@6.5.2 canvas-confetti@1.9.3 tailwindcss@3.4.14

      - name: Preparar carpeta web (con librerías locales para usar sin internet)
        run: |
          mkdir -p www/vendor/fontawesome
          cp index.html firebase-config.js manifest.json sw.js www/
          cp -r icons www/

          ok=true
          for f in app auth firestore; do
            src=$(find node_modules/firebase -maxdepth 2 -name "firebase-$f-compat.js" | head -n 1)
            if [ -n "$src" ]; then cp "$src" www/vendor/; else echo "::warning::No se encontró firebase-$f-compat.js"; ok=false; fi
          done
          cp node_modules/canvas-confetti/dist/confetti.browser.js www/vendor/ || ok=false
          cp -r node_modules/@fortawesome/fontawesome-free/css node_modules/@fortawesome/fontawesome-free/webfonts www/vendor/fontawesome/ || ok=false
          npx tailwindcss -c tailwind.config.js -i tailwind.input.css -o www/vendor/tailwind.css --minify || ok=false

          # Solo si está todo, la app usará las copias locales; si no, las cargará de internet
          if [ "$ok" = true ]; then
            echo "window.__VENDOR_OK = true;" > www/vendor/ok.js
            echo "Librerías locales listas"
          else
            echo "::warning::Faltan librerías locales; la app las cargará de internet"
          fi
          ls -la www www/vendor

      - name: Configurar Capacitor y plataforma Android
        run: |
          npx cap init "Nuestra Compra" "com.familia.nuestracompra" --web-dir "www"
          npx cap add android
          npx cap sync android

      # Número de versión que siempre sube (Android lo muestra como actualización).
      # Se calcula con la fecha, así sigue subiendo aunque cambies de repositorio.
      - name: Poner número de versión automático
        run: |
          CODE=$(( ($(date +%s) - 1767225600) / 60 ))
          NAME="1.${{ github.run_number }}"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          sed -i "s/__APP_VERSION__/$NAME/" android/app/src/main/assets/public/index.html
          echo "APP_VERSION=$NAME" >> $GITHUB_ENV

      # Clave de firma fija: así puedes instalar versiones nuevas encima sin desinstalar (y sin perder tus listas)
      - name: Usar siempre la misma clave de firma
        run: |
          mkdir -p ~/.android
          cp android-keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: NuestraCompra-APK-v${{ env.APP_VERSION }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
